<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Certificate Creator - Customer Service</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { 
            background: #f0f4f8; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
        }
        
        /* Control Panel */
        .controls { 
            background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 30px; display: flex; flex-direction: column; gap: 20px; max-width: 900px; width: 100%;
        }
        .control-section { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
        .control-section:last-child { border-bottom: none; padding-bottom: 0; }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
        label { font-size: 0.8rem; font-weight: 700; color: #475569; text-transform: uppercase; }
        input { padding: 10px; border: 2px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
        
        button { 
            background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 6px; 
            cursor: pointer; font-weight: 700; transition: 0.2s; 
        }
        button:hover { background: #1d4ed8; }
        .btn-bulk { background: #10b981; }
        .btn-bulk:hover { background: #059669; }

        /* Certificate Preview Area (A4 Landscape Proportions) */
        #cert-wrapper { background: #e2e8f0; padding: 20px; border-radius: 10px; overflow-x: auto; max-width: 100%; box-shadow: inset 0 4px 10px rgba(0,0,0,0.05); }
        #cert-container { 
            width: 1123px; height: 794px; /* A4 Landscape at 96DPI */
            background: white; position: relative; overflow: hidden; color: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; box-sizing: border-box;
        }

        /* The Blue Star */
        .star-logo { width: 150px; height: 150px; margin-bottom: 20px; }

        /* Typography */
        .company-name { font-size: 22px; font-weight: 600; margin-bottom: 30px; letter-spacing: 1px; }
        .title { font-size: 36px; font-weight: 700; margin-bottom: 40px; letter-spacing: 2px; }
        .presented-to { font-size: 18px; margin-bottom: 15px; }
        .student-details { font-size: 24px; font-weight: 700; margin-bottom: 30px; text-decoration: underline; text-underline-offset: 8px;}
        .performance { font-size: 18px; margin-bottom: 10px; }
        .module { font-size: 22px; font-weight: 700; margin-bottom: 60px; }
        .footer-logo { font-size: 20px; font-weight: 900; color: #333; letter-spacing: 2px; text-transform: lowercase; }

        /* Side Flaps */
        .flap {
            position: absolute;
            top: 50%;
            background: #1e293b;
            color: white;
            padding: 10px 40px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .left-flap {
            left: 0;
            transform: translate(-42%, -50%) rotate(-90deg);
        }
        .right-flap {
            right: 0;
            transform: translate(42%, -50%) rotate(90deg);
        }
        
        #status { font-weight: bold; color: #10b981; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="controls">
        <div class="control-section">
            <div class="input-group">
                <label>Single Student Name</label>
                <input type="text" id="singleName" value="LEEPILE DISEKO">
            </div>
            <div class="input-group">
                <label>ID Number</label>
                <input type="text" id="singleID" value="6504195821082">
            </div>
            <button onclick="updatePreview()">Preview</button>
            <button onclick="downloadSinglePDF()">Download 1 PDF</button>
        </div>

        <div class="control-section">
            <div class="input-group">
                <label>Bulk Upload (CSV file: Name, ID)</label>
                <input type="file" id="csvInput" accept=".csv">
            </div>
            <button class="btn-bulk" onclick="processBulkCSV()">Generate Bulk Multi-page PDF</button>
        </div>
        <div id="status"></div>
    </div>

    <div id="cert-wrapper">
        <div id="cert-container">
            <div class="flap left-flap">Attended - November 2025</div>
            
            <div class="flap right-flap">Issued - February 2026</div>

            <svg class="star-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <polygon points="50,0 60,40 100,50 60,60 50,100 40,60 0,50 40,40" fill="#4a7eb5" stroke="#2c4e70" stroke-width="1"/>
            </svg>

            <div class="company-name">MARIA MOTSHILI PTY LTD</div>
            <div class="title">CERTIFICATE OF ACHIEVEMENT</div>
            <div class="presented-to">PROUDLY PRESENTED TO</div>
            
            <div class="student-details" id="cert-student">LEEPILE DISEKO, ID 6504195821082</div>
            
            <div class="performance">FOR THEIR EXCELLENT PERFORMANCE IN</div>
            <div class="module">CUSTOMER SERVICE MODULE</div>
            
            <div class="footer-logo">cathsseta</div>
        </div>
    </div>

        const certStudent = document.getElementById('cert-student');
        const statusDiv = document.getElementById('status');

        // Update Live Preview
        function updatePreview() {
            certStudent.innerText = `${singleNameInput.value.toUpperCase()}, ID ${singleIDInput.value}`;
        }

        // Generate Single PDF
        async function downloadSinglePDF() {
            updatePreview();
            await createPDF(`${singleNameInput.value.replace(/\s+/g, '_')}_Certificate.pdf`, false);
        }
