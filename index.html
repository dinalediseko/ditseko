<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Certificate Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .controls { 
            background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            margin-bottom: 30px; width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.7rem; font-weight: 900; color: #1e3a8a; text-transform: uppercase; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        button { 
            padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; color: white; transition: 0.3s;
        }
        .btn-preview { background: #64748b; }
        .btn-bulk { background: #ea580c; grid-column: span 2; font-size: 1.1rem; }
        button:hover { opacity: 0.8; }

        /* Certificate Container */
        #cert-wrapper { background: #ddd; padding: 20px; border-radius: 8px; }
        #cert-container { 
            width: 1123px; height: 794px; background: white; position: relative; 
            display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
            border: 1px solid #eee; overflow: hidden;
        }

        /* Top Bar Section */
        .header { width: 100%; padding: 40px 60px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        #main-logo { height: 80px; width: auto; }
        .company-info { text-align: right; border-bottom: 4px solid #ea580c; }
        .company-name { font-weight: 900; font-size: 18px; color: #1e3a8a; letter-spacing: 1px; }

        /* Main Content */
        .content { text-align: center; margin-top: 20px; }
        h1 { font-size: 65px; font-weight: 900; color: #1e3a8a; margin: 0; letter-spacing: -2px; }
        h2 { font-size: 20px; color: #ea580c; letter-spacing: 6px; margin: 5px 0 60px 0; font-weight: 700; text-transform: uppercase; }
        
        .sub-text { font-size: 14px; color: #64748b; font-weight: 700; letter-spacing: 2px; }
        .student-name { font-size: 42px; font-weight: 700; color: #1e3a8a; margin: 20px 0; border-bottom: 2px solid #e2e8f0; width: 800px; padding-bottom: 10px; }
        .course-text { font-size: 16px; color: #475569; line-height: 1.6; max-width: 700px; margin-top: 20px; }
        .course-name { font-weight: 900; color: #1e3a8a; display: block; margin-top: 5px; font-size: 20px; }

        /* Bottom Section */
        .footer { position: absolute; bottom: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        #cathsseta-logo { height: 60px; margin-top: 20px; }
        
        /* The Blue Star (Bottom Center) */
        .star-seal { width: 100px; height: 100px; margin-bottom: 10px; }

        /* Side Flaps */
        .flap {
            position: absolute; top: 50%; background: #1e3a8a; color: white;
            padding: 8px 30px; font-size: 12px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; white-space: nowrap; z-index: 10;
        }
        .left-flap { left: 0; transform: translate(-38%, -50%) rotate(-90deg); }
        .right-flap { right: 0; transform: translate(38%, -50%) rotate(90deg); }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Upload Maria Motshili Logo</label>
            <input type="file" id="logoMain" accept="image/*" onchange="loadImg(event, 'main-logo')">
        </div>
        <div class="input-group">
            <label>Upload Cathsseta Logo</label>
            <input type="file" id="logoSeta" accept="image/*" onchange="loadImg(event, 'cathsseta-logo')">
        </div>
        <div class="input-group">
            <label>Student Name</label>
            <input type="text" id="inName" value="LEEPILE DISEKO">
        </div>
        <div class="input-group">
            <label>ID Number</label>
            <input type="text" id="inID" value="6504195821082">
        </div>
        <div class="input-group">
            <label>Bulk CSV (Name, ID)</label>
            <input type="file" id="csvFile" accept=".csv">
        </div>
        <button class="btn-preview" onclick="updatePreview()">Refresh Preview</button>
        <button class="btn-bulk" onclick="generateBulk()">GENERATE 50+ CERTIFICATES (SINGLE PDF)</button>
    </div>

    <div id="cert-wrapper">
        <div id="cert-container">
            <div class="flap left-flap">Attended - November 2025</div>
            <div class="flap right-flap">Issued - February 2026</div>

            <div class="header">
                <img id="main-logo" src="" alt="Logo">
                <div class="company-info">
                    <div class="company-name">MARIA MOTSHILI (PTY)LTD</div>
                </div>
            </div>

            <div class="content">
                <h1>CERTIFICATE</h1>
                <h2>of achievement</h2>
                
                <p class="sub-text">THIS CERTIFICATE IS PROUDLY PRESENTED TO</p>
                <div class="student-name" id="dispName">LEEPILE DISEKO</div>
                <div class="sub-text" style="font-size: 18px;" id="dispID">ID 6504195821082</div>

                <p class="course-text">
                    for his excellent performance in
                    <span class="course-name">CUSTOMER SERVICE MODULE</span>
                </p>
            </div>

            <div class="footer">
                <svg class="star-seal" viewBox="0 0 100 100">
                    <polygon points="50,5 63,37 95,50 63,63 50,95 37,63 5,50 37,37" fill="#1e3a8a"/>
                </svg>
                <img id="cathsseta-logo" src="" alt="Seta Logo">
            </div>
        </div>
    </div>

    <script>
        function loadImg(event, targetId) {
            const reader = new FileReader();
            reader.onload = () => document.getElementById(targetId).src = reader.result;
            reader.readAsDataURL(event.target.files[0]);
        }

        function updatePreview() {
            document.getElementById('dispName').innerText = document.getElementById('inName').value.toUpperCase();
            document.getElementById('dispID').innerText = "ID " + document.getElementById('inID').value;
        }

        async function generateBulk() {
            const csv = document.getElementById('csvFile').files[0];
            if (!csv) return alert("Please upload a CSV file first!");

            const reader = new FileReader();
            reader.onload = async (e) => {
                const lines = e.target.result.split('\n').filter(l => l.trim());
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('l', 'px', [1123, 794]);
                const element = document.getElementById('cert-container');

                for (let i = 0; i < lines.length; i++) {
                    const [name, id] = lines[i].split(',');
                    document.getElementById('dispName').innerText = name.trim().toUpperCase();
                    document.getElementById('dispID').innerText = "ID " + id.trim();
                    
                    await new Promise(r => setTimeout(r, 100)); // Ensure render
                    const canvas = await html2canvas(element, { scale: 2 });
                    if (i > 0) pdf.addPage();
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.8), 'JPEG', 0, 0, 1123, 794);
                }
                pdf.save('All_Certificates.pdf');
            };
            reader.readAsText(csv);
        }
    </script>
</body>
</html>
