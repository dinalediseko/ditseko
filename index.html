<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maria Motshili Professional Certificate Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: 'Montserrat', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        
        .controls { 
            background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            margin-bottom: 30px; width: 100%; max-width: 1000px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
        }
        
        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.7rem; font-weight: 900; color: #1e3a8a; text-transform: uppercase; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        button { 
            padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: 700; color: white; transition: 0.3s;
        }
        .btn-preview { background: #1e3a8a; }
        .btn-bulk { background: #000; grid-column: span 2; font-size: 1.1rem; }
        button:hover { opacity: 0.8; }

        /* Certificate Container */
        #cert-wrapper { background: #ddd; padding: 20px; border-radius: 8px; }
        #cert-container { 
            width: 1123px; height: 794px; background: white; position: relative; 
            display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
            border: 20px solid #1e3a8a; overflow: hidden;
        }
        
        /* Inner Border */
        .inner-border {
            border: 2px solid #1e3a8a; width: 100%; height: 100%; display: flex; flex-direction: column; 
            align-items: center; padding: 40px; box-sizing: border-box; position: relative;
        }

        /* Side Flaps */
        .flap {
            position: absolute; top: 50%; background: #1e3a8a; color: white;
            padding: 8px 35px; font-size: 12px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; white-space: nowrap; z-index: 20;
        }
        .left-flap { left: 0; transform: translate(-35%, -50%) rotate(-90deg); }
        .right-flap { right: 0; transform: translate(35%, -50%) rotate(90deg); }

        .header-logo { height: 90px; margin-bottom: 15px; }
        .company-name { font-weight: 900; font-size: 28px; color: #1e3a8a; letter-spacing: 2px; margin-bottom: 10px; }
        .cert-title { font-family: 'Playfair Display', serif; font-size: 58px; font-weight: 700; color: #1e3a8a; margin: 10px 0; border-top: 2px solid #1e3a8a; border-bottom: 2px solid #1e3a8a; padding: 10px 40px; }
        
        .presented-to { font-size: 18px; color: #444; font-weight: 600; letter-spacing: 4px; margin-top: 40px; text-transform: uppercase; }
        .student-name { font-family: 'Playfair Display', serif; font-size: 48px; font-style: italic; font-weight: 700; color: #000; margin: 20px 0 10px 0; }
        .id-number { font-size: 20px; color: #1e3a8a; font-weight: 700; margin-bottom: 40px; }

        .performance-text { font-size: 18px; color: #444; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .module-name { font-weight: 900; color: #1e3a8a; font-size: 24px; margin-top: 10px; display: block; }

        /* Footer with Two Stars */
        .footer { 
            position: absolute; bottom: 40px; width: 100%; 
            display: flex; justify-content: center; align-items: center; gap: 40px; 
        }
        .star-seal { width: 60px; height: 60px; }
        #cathsseta-logo { height: 70px; }

    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Upload Main Logo</label>
            <input type="file" accept="image/*" onchange="loadImg(event, 'main-logo')">
        </div>
        <div class="input-group">
            <label>Upload Cathsseta Logo</label>
            <input type="file" accept="image/*" onchange="loadImg(event, 'cathsseta-logo')">
        </div>
        <div class="input-group">
            <label>Student Name</label>
            <input type="text" id="inName" value="LEEPILE DISEKO">
        </div>
        <div class="input-group">
            <label>ID Number</label>
            <input type="text" id="inID" value="6504195821082">
        </div>
        <div class="input-group">
            <label>Bulk CSV (Name, ID)</label>
            <input type="file" id="csvFile" accept=".csv">
        </div>
        <button class="btn-preview" onclick="updatePreview()">Refresh Preview</button>
        <button class="btn-bulk" onclick="generateBulk()">GENERATE ALL CERTIFICATES (SINGLE PDF)</button>
    </div>

    <div id="cert-wrapper">
        <div id="cert-container">
            <div class="flap left-flap">Attended - November 2025</div>
            <div class="flap right-flap">Issued - February 2026</div>

            <div class="inner-border">
                <img id="main-logo" class="header-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eee'/%3E%3C/svg%3E" alt="Logo">
                
                <div class="company-name">MARIA MOTSHILI PTY LTD</div>
                <div class="cert-title">CERTIFICATE OF ACHIEVEMENT</div>
                
                <div class="presented-to">PROUDLY PRESENTED TO</div>
                
                <div class="student-name" id="dispName">LEEPILE DISEKO</div>
                <div class="id-number" id="dispID">ID 6504195821082</div>

                <div class="performance-text">
                    FOR THEIR EXCELLENT PERFORMANCE IN
                    <span class="module-name">CUSTOMER SERVICE MODULE</span>
                </div>

                <div class="footer">
                    <svg class="star-seal" viewBox="0 0 100 100">
                        <polygon points="50,5 63,37 95,50 63,63 50,95 37,63 5,50 37,37" fill="#1e3a8a"/>
                    </svg>

                    <img id="cathsseta-logo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23eee'/%3E%3C/svg%3E" alt="Seta Logo">

                    <svg class="star-seal" viewBox="0 0 100 100">
                        <polygon points="50,5 63,37 95,50 63,63 50,95 37,63 5,50 37,37" fill="#1e3a8a"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadImg(event, targetId) {
            const reader = new FileReader();
            reader.onload = () => document.getElementById(targetId).src = reader.result;
            reader.readAsDataURL(event.target.files[0]);
        }

        function updatePreview() {
            document.getElementById('dispName').innerText = document.getElementById('inName').value.toUpperCase();
            document.getElementById('dispID').innerText = "ID " + document.getElementById('inID').value;
        }

        async function generateBulk() {
            const csv = document.getElementById('csvFile').files[0];
            if (!csv) return alert("Please upload a CSV file first!");

            const reader = new FileReader();
            reader.onload = async (e) => {
                const lines = e.target.result.split('\n').filter(l => l.trim());
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('l', 'px', [1123, 794]);
                const element = document.getElementById('cert-container');

                for (let i = 0; i < lines.length; i++) {
                    const row = lines[i].split(',');
                    if(row.length < 2) continue;
                    
                    const name = row[0].trim();
                    const id = row[1].trim();
                    
                    document.getElementById('dispName').innerText = name.toUpperCase();
                    document.getElementById('dispID').innerText = "ID " + id;
                    
                    await new Promise(r => setTimeout(r, 150)); 
                    const canvas = await html2canvas(element, { scale: 2, useCORS: true });
                    if (i > 0) pdf.addPage();
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 1123, 794);
                }
                pdf.save('Maria_Motshili_Certificates.pdf');
            };
            reader.readAsText(csv);
        }
    </script>
</body>
</html>
